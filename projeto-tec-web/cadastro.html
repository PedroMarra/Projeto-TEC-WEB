<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Sabor & Arte | Nova Receita</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <header>
        <h1>Sabor & Arte</h1>
        <nav aria-label="Navegação Principal">
            <ul>
                <li><a href="./index.html">Página Inicial</a></li>
                <li><a href="./cadastro.html" aria-current="page">Publicar Receita</a></li>
                <li><a href="./receitas.html">Ver Receitas</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Compartilhe sua Receita</h2>
            <p>Preencha os dados abaixo para adicionar um novo prato ao blog.</p>
            <br>
            <form id="form-receita" aria-label="Formulário de cadastro de receita">
                <fieldset>
                    <label for="titulo">Nome do Prato:</label>
                    <input type="text" id="titulo" placeholder="Ex: Bolo de Cenoura" aria-required="true">
                </fieldset>
                
                <fieldset>
                    <label for="ingredientes">Ingredientes (Resumo):</label>
                    <textarea id="ingredientes" rows="3" placeholder="Ex: 3 cenouras, 4 ovos, farinha..." aria-required="true"></textarea>
                </fieldset>

                <fieldset>
                    <label for="tempo">Tempo de Preparo (em minutos):</label>
                    <input type="number" id="tempo" placeholder="Ex: 45" aria-required="true">
                </fieldset>

                <button type="submit">Publicar Receita</button>
                
                <span id="mensagem-status" aria-live="polite"></span>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Blog Culinário Sabor & Arte. Feito com semântica HTML.</p>
    </footer>
    <script src="./src/app.js"></script>
</body>
</html>

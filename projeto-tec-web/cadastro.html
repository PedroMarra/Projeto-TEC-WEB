<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Sabor & Arte | Criar Conta</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>Sabor & Arte</h1>
        <nav aria-label="Navegação Principal">
            <ul>
                <li><a href="./index.html">Voltar ao Início</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Crie sua Conta de Chef</h2>
            <p>Cadastre-se para poder publicar suas receitas na plataforma.</p>
            <br>
            <form id="form-cadastro-usuario" aria-label="Formulário de cadastro de usuário">
                <fieldset>
                    <label for="reg-nome">Nome Completo:</label>
                    <input type="text" id="reg-nome" required>
                </fieldset>
                <fieldset>
                    <label for="reg-email">E-mail:</label>
                    <input type="email" id="reg-email" required>
                </fieldset>
                <fieldset>
                    <label for="reg-senha">Crie uma Senha:</label>
                    <input type="password" id="reg-senha" required minlength="4">
                </fieldset>

                <button type="submit" class="btn-primario">Cadastrar Usuário</button>
                <span id="msg-reg-status" aria-live="polite"></span>
            </form>
        </section>
    </main>
    <footer><p>&copy; 2026 Blog Sabor & Arte.</p></footer>
    <script src="./app.js"></script>
</body>
</html>
